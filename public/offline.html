<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#242a26">
<title>Offline · Fido</title>
<style>
  :root { --bg: #242a26; --card: #fffdf8; --ink: #242a26; --muted: #62695f; --accent: #a83e2b; --accent-ink: #fffdf8; color-scheme: light; }
  @media (prefers-color-scheme: dark) { :root { --bg: #111512; --card: #222622; --ink: #ecede6; --muted: #b5bcae; --accent: #d7755f; --accent-ink: #171a18; color-scheme: dark; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 16px; background: var(--bg); color: var(--ink);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", "Noto Sans Sinhala", "Noto Sans Tamil", sans-serif; }
  main { width: 100%; max-width: 400px; background: var(--card); border-radius: 6px; padding: 26px 22px; }
  .brand { font-weight: 700; letter-spacing: 2px; font-size: 16px; }
  h1 { font-size: 21px; margin: 14px 0 6px; }
  p { margin: 0 0 12px; color: var(--muted); }
  button { width: 100%; min-height: 44px; border: 0; border-radius: 5px; background: var(--accent); color: var(--accent-ink); font: inherit; font-weight: 600; cursor: pointer; }
  .small { font-size: 13px; }
</style>
</head>
<body>
<main>
  <div class="brand">FIDO</div>
  <h1>No connection</h1>
  <p>This device can't reach the Fido server. Sales, payments, stock and tasks need a live connection, so nothing can be saved right now.</p>
  <p class="small">Check Wi-Fi or mobile data. This page reloads by itself when the connection comes back.</p>
  <button type="button" onclick="location.reload()">Try again</button>
</main>
<script>
  addEventListener("online", function () { location.reload(); });
</script>
</body>
</html>
